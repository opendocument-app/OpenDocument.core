name: release

# Draft from main or release/*; publish manually to trigger package workflows.
# Publication creates the tag on the stamp commit. See AGENTS.md for the release flow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: version to cut (e.g. v6.2.0) — leave empty to let the commits decide
        required: false
      dry_run:
        description: go through the motions without pushing or drafting anything
        type: boolean
        default: false

# Queued, not cancelled: this pushes a commit, drafts a release and uploads
# assets, and an interrupt between two of those leaves the release half-made.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# write is the `release` job's alone — it is the one that pushes
permissions:
  contents: read

jobs:
  # Separate because the version is an input to everything below: an artifact
  # that records its own identity has to know the tag before the tag exists.
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.derive.outputs.version }}
    steps:
      # dispatch takes any ref; `stamp` would only refuse it after the build
      - name: refuse a ref that is not a release line
        env:
          REF: ${{ github.ref_name }}
        run: |
          case "$REF" in
            main | release/*) ;;
            *) echo "::error::$REF is neither main nor a release/vX.Y.X branch"
               exit 1 ;;
          esac

      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0 # git-cliff reads back to the last tag

      - name: setup python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: 3.14
      - name: install git-cliff
        run: pip install git-cliff==2.13.1

      - name: check release helpers
        run: python -m unittest discover -s scripts/tests

      - name: derive the version from the commits
        id: derive
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          args=()
          if [ -n "$REQUESTED_VERSION" ]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          VERSION=$(scripts/release.py version "${args[@]}")
          echo "cutting $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Here rather than beside `notes`, so release copy nobody wrote costs
      # seconds instead of a version. Dry runs included — a dry run is the
      # rehearsal for the release body.
      - name: check the changelog has something to say
        env:
          VERSION: ${{ steps.derive.outputs.version }}
        run: scripts/release.py changelog --version "$VERSION" > /dev/null

  # SwiftPM resolves `Package.swift` at the tag, and its binary target names a
  # sha256 of an archive that does not exist until it is built — so the archive
  # is built here, against the version derived above, and its checksum comes
  # back to be stamped below.
  #
  # Anything that merely reacts to a release belongs in its own workflow on
  # `release: published`, the way conan, maven and android do.
  apple:
    needs: version
    uses: ./.github/workflows/apple.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, apple]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the draft
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # `GITHUB_TOKEN` cannot push to main: the ruleset holds it to the pull
      # request rule, and GitHub Actions cannot be a bypass actor. This app can.
      - name: mint a token for the app
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }} # the stamp push below

      - name: setup python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: 3.14
      - name: install git-cliff
        run: pip install git-cliff==2.13.1

      # `release-asset-*` is the opt-in: a job that wants something on the
      # release names its artifact that way. Downloaded outside the repo, so an
      # artifact can never be swept into the commit.
      - name: download assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-asset-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
        continue-on-error: true

      # Whatever the release has to record about itself is written into the tree
      # here; `stamp` commits all of it as one commit.
      #
      # The patterns match the previous release's values as well as the
      # `UNRELEASED` placeholder, since main keeps the last stamp.
      - name: point Package.swift at this release
        env:
          CHECKSUM: ${{ needs.apple.outputs.checksum }}
        run: |
          sed -i \
            -e "s|download/[^/]*/OdrCoreObjC|download/${VERSION}/OdrCoreObjC|" \
            -e "s|checksum: \"[0-9a-f]\{64\}\"|checksum: \"${CHECKSUM}\"|" \
            Package.swift
          git diff --stat Package.swift

      - name: cut the changelog
        run: |
          scripts/release.py cut \
            --version "$VERSION" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: release notes
        run: scripts/release.py notes --version "$VERSION" --output "${{ runner.temp }}/notes.md"

      - name: stamp
        run: |
          git config user.name "${{ steps.app.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com"
          scripts/release.py stamp \
            --version "$VERSION" \
            --branch "${GITHUB_REF#refs/heads/}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--version "$VERSION" --notes "$RUNNER_TEMP/notes.md")
          mkdir -p "$RUNNER_TEMP/assets"
          while IFS= read -r -d '' asset; do
            args+=(--asset "$asset")
          done < <(find "$RUNNER_TEMP/assets" -type f -print0)
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          scripts/release.py publish "${args[@]}"

      - name: summary
        run: |
          {
            echo "### ${VERSION} is drafted"
            echo
            echo "Publishing the draft creates the tag and starts conan, maven and android."
            echo
            cat "${{ runner.temp }}/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
