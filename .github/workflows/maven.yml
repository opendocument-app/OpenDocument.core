name: maven

on:
  push:
    # branches only: publishing a release pushes a tag, which is not a change
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: version to publish (e.g. 5.5.0-test1)
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: setup java
        uses: actions/setup-java@f4f1212c880fdec8162ea9a6493f4495191887b4 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # jni/mvnw pins Maven 3.9. Maven 3.10 stages a maven-metadata-local.xml
      # that central-publishing-maven-plugin 0.11.0 does not remove, and Central
      # rejects the bundle: "Bundle has content that does NOT have a .pom file".
      - name: build
        run: jni/mvnw --batch-mode --no-transfer-progress --file jni/pom.xml verify

  # Split out so the secrets sit behind an environment and are never in reach of
  # a plain push build.
  publish:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    environment: maven-central
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: setup java
        uses: actions/setup-java@f4f1212c880fdec8162ea9a6493f4495191887b4 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github

      - name: get version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = release ]; then
            echo "REVISION=${GITHUB_REF_NAME:1}" >> "$GITHUB_ENV"
          else
            echo "REVISION=${INPUT_VERSION}" >> "$GITHUB_ENV"
          fi

      # GitHub Packages refuses a second upload of a version with 409, so a rerun
      # after a failed Maven Central step must not upload again.
      - name: publish to github packages
        run: |
          if curl --silent --fail --output /dev/null --user "x:${GITHUB_TOKEN}" \
            "https://maven.pkg.github.com/${GITHUB_REPOSITORY}/app/opendocument/odr-core-java/${REVISION}/odr-core-java-${REVISION}.pom"; then
            echo "odr-core-java ${REVISION} is already on GitHub Packages"
            exit 0
          fi
          jni/mvnw --batch-mode --no-transfer-progress --file jni/pom.xml deploy -Drevision="${REVISION}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A second setup-java: the central profile deploys to a different server
      # id and needs the signing key in the runner's gpg keyring, and the step
      # above has already had its turn with settings.xml.
      - name: setup java for maven central
        uses: actions/setup-java@f4f1212c880fdec8162ea9a6493f4495191887b4 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: publish to maven central
        run: jni/mvnw --batch-mode --no-transfer-progress --file jni/pom.xml deploy -Pcentral -Drevision="${REVISION}"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASS }}
