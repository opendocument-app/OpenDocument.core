[versions]
# kept in step with OpenDocument.droid, which consumes this artifact
agp = "9.3.1"

# as is the formatter, so a file can move between the two repos unchanged
spotless = "8.8.0"
ktfmt = "0.64"

# sonatype ships no official gradle plugin for the central portal, so this is
# the community one android libraries have settled on
mavenPublish = "0.37.0"

junit = "4.13.2"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
