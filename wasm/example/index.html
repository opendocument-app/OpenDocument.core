<!doctype html>
<!--
  Eyeball the renderer's output. No bundler, no install: build `odr_wasm`, then
  serve the repository over HTTP and open this file. It imports the built
  package straight out of the build directory.

  This is manual QA and the page a contributor is pointed at, not a product.
  The real viewer lives in its own repository.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>odr — WebAssembly example</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      }
      #status { opacity: 0.7; }
      #views { margin-left: auto; }
      iframe { flex: 1; border: 0; width: 100%; }
      #drop { flex: 1; display: grid; place-items: center; opacity: 0.6; }
      #drop[hidden] { display: none; }
    </style>
  </head>
  <body>
    <header>
      <input type="file" id="file" />
      <button id="edit" hidden>edit</button>
      <button id="save" hidden disabled>save…</button>
      <span id="status">loading…</span>
      <select id="views" hidden></select>
    </header>
    <div id="drop">drop a document anywhere, or pick one above</div>
    <iframe id="view" hidden sandbox="allow-same-origin allow-scripts"></iframe>

    <script type="module">
      import { Odr } from '../../build-wasm/wasm/dist/index.js';

      const status = document.getElementById('status');
      const views = document.getElementById('views');
      const frame = document.getElementById('view');
      const drop = document.getElementById('drop');
      const edit = document.getElementById('edit');
      const save = document.getElementById('save');

      const odr = await Odr.load();
      status.textContent = odr.identify();

      let doc = null;
      let url = null;
      let filename = 'document';
      let framed = null;

      // What the page in the frame publishes, or null for a view that has no
      // editor - anything but a sheet, today.
      function editing() {
        return frame.contentWindow?.odr?.editing ?? null;
      }

      // A view holds its own log, so it is applied before the view goes away
      // and again before a save; a cell op is idempotent, so both is fine.
      // False where the engine refused one, which keeps the log.
      function collect() {
        const page = framed === doc ? editing() : null;
        if (page === null || !page.isEditable()) return true;
        const operations = page.getOperations();
        if (JSON.parse(operations).ops.length === 0) return true;
        try {
          doc.edit(operations);
        } catch (e) {
          status.textContent = `${e.name} — ${e.message}`;
          return false;
        }
        page.committed();
        return true;
      }

      // The three callbacks a host assigns, which on droid/ios go in through
      // `evaluateJavascript` once the WebView has finished loading.
      function wire() {
        const page = editing();
        // `odr.editing` is on every document view, so what greys the button is
        // the page's own answer rather than the absence of the object.
        edit.hidden = page === null || !page.isEditable();
        save.hidden = edit.hidden || !doc.isSavable();
        if (page === null) return;
        edit.textContent = 'edit';
        frame.contentWindow.odr.onEditRefused = (event) => {
          // the snackbar an app writes in its own string catalogue
          status.textContent = `${event.reason} (${event.code}): ${event.message}`;
        };
        frame.contentWindow.odr.onEditChange = (event) => {
          save.disabled = !event.dirty;
          save.textContent = event.dirty ? `save (${event.operations})` : 'save…';
        };
        frame.contentWindow.odr.onEditModeChange = (event) => {
          edit.textContent = event.editing ? 'editing' : 'edit';
          if (event.reason) status.textContent = event.message;
        };
      }

      function show(index) {
        collect();
        const { html, externalResources } = doc.render(index);
        if (externalResources.length > 0) {
          // Media is never inlined, so a blob: iframe cannot resolve it. A real
          // viewer mints blob: URLs through a resource locator; this page just
          // says so.
          console.warn('not inlined, will not load here:', externalResources);
        }
        if (url) URL.revokeObjectURL(url);
        url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
        frame.onload = wire;
        frame.src = url;
        framed = doc;
        frame.hidden = false;
        drop.hidden = true;
      }

      async function open(file) {
        doc?.close();
        try {
          doc = odr.open(new Uint8Array(await file.arrayBuffer()), {
            name: file.name,
            editable: true,
          });
        } catch (e) {
          status.textContent = `${file.name}: ${e.name} — ${e.message}`;
          return;
        }

        if (doc.isPasswordEncrypted()) {
          const password = prompt(`Password for ${file.name}`);
          try {
            doc.decrypt(password ?? '');
          } catch (e) {
            status.textContent = `${file.name}: ${e.name}`;
            return;
          }
        }

        filename = file.name;
        const list = doc.listViews();
        views.replaceChildren(
          ...list.map((v) => new Option(`${v.name} (${v.path})`, v.index)),
        );
        views.hidden = list.length < 2;
        status.textContent = `${file.name} — ${list.length} view(s)`;
        show(0);
      }

      document
        .getElementById('file')
        .addEventListener('change', (e) => e.target.files[0] && open(e.target.files[0]));
      views.addEventListener('change', () => show(Number(views.value)));

      edit.addEventListener('click', () => {
        const page = editing();
        page.isEnabled() ? page.disable() : page.enable();
      });

      save.addEventListener('click', () => {
        // a file without the edits is not what the button offers
        if (!collect()) return;
        const saved = URL.createObjectURL(new Blob([doc.save()]));
        const link = document.createElement('a');
        link.href = saved;
        link.download = filename;
        link.click();
        // revoking in the same tick cancels the download in chrome
        setTimeout(() => URL.revokeObjectURL(saved), 0);
      });

      document.addEventListener('dragover', (e) => e.preventDefault());
      document.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files[0]) open(e.dataTransfer.files[0]);
      });
    </script>
  </body>
</html>
