<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sheet array formula checks</title>
    <link rel="stylesheet" href="document.css" />
    <link rel="stylesheet" href="spreadsheet.css" />
  </head>
  <body
    class="odr-body odr-gridlines-soft"
    data-odr-editable="true"
    data-odr-keyboard="navigation shortcuts"
    data-odr-formula-syntax="opendocument"
    data-odr-formula-settings='{"dialect":"libreoffice","nullDate":0}'
  >
    <!-- B1:B3 is one array formula, `{=A1:A3*2}`, and D1 another one in its
         own cell. C1 reads B2, a cell of the range. E1:F1 is an array of
         constants, which reads no cell. -->
    <table class="odr-sheet" data-odr-sheet="0" data-odr-sheet-name="S">
      <col class="odr-sheet-gutter" />
      <col style="width: 80px" />
      <col style="width: 80px" />
      <col style="width: 80px" />
      <col style="width: 80px" />
      <col style="width: 80px" />
      <col style="width: 80px" />
      <thead>
        <tr>
          <th class="odr-sheet-corner" style="width:calc(1ch + 14px)"></th>
          <th class="odr-sheet-column-header">A</th>
          <th class="odr-sheet-column-header">B</th>
          <th class="odr-sheet-column-header">C</th>
          <th class="odr-sheet-column-header">D</th>
          <th class="odr-sheet-column-header">E</th>
          <th class="odr-sheet-column-header">F</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th class="odr-sheet-row-header">1</th>
          <td class="odr-value-type-float" style="max-width:0;white-space:nowrap">1</td>
          <td class="odr-value-type-float odr-locked" data-odr-lock="array" data-odr-formula="of:=[.A1:.A3]*2" data-odr-reads="0,0,0,0,2" data-odr-array="1,3" style="max-width:0;white-space:nowrap">2</td>
          <td class="odr-value-type-float" data-odr-formula="of:=[.B2]+1" data-odr-reads="0,1,1,1,1" style="max-width:0;white-space:nowrap">5</td>
          <td class="odr-value-type-float odr-locked" data-odr-lock="array" data-odr-formula="of:=SUM([.A1:.A3]*[.A1:.A3])" data-odr-reads="0,0,0,0,2" data-odr-array="1,1" style="max-width:0;white-space:nowrap">14</td>
          <td class="odr-value-type-float odr-locked" data-odr-lock="array" data-odr-formula="of:={1;2}" data-odr-array="2,1" style="max-width:0;white-space:nowrap">1</td>
          <td class="odr-value-type-float odr-locked" data-odr-lock="array" style="max-width:0;white-space:nowrap">2</td>
        </tr>
        <tr>
          <th class="odr-sheet-row-header">2</th>
          <td class="odr-value-type-float" style="max-width:0;white-space:nowrap">2</td>
          <td class="odr-value-type-float odr-locked" data-odr-lock="array" style="max-width:0;white-space:nowrap">4</td>
          <td style="max-width:0;white-space:nowrap"></td>
          <td style="max-width:0;white-space:nowrap"></td>
          <td style="max-width:0;white-space:nowrap"></td>
          <td style="max-width:0;white-space:nowrap"></td>
        </tr>
        <tr>
          <th class="odr-sheet-row-header">3</th>
          <td class="odr-value-type-float" style="max-width:0;white-space:nowrap">3</td>
          <td class="odr-value-type-float odr-locked" data-odr-lock="array" style="max-width:0;white-space:nowrap">6</td>
          <td style="max-width:0;white-space:nowrap"></td>
          <td style="max-width:0;white-space:nowrap"></td>
          <td style="max-width:0;white-space:nowrap"></td>
          <td style="max-width:0;white-space:nowrap"></td>
        </tr>
      </tbody>
    </table>

    <div id="report"></div>
    <script src="error-codes.js"></script>
    <script src="editing.js"></script>
    <script src="spreadsheet.js"></script>
    <script src="odr-formula.js"></script>
    <script src="sheet-editing.js"></script>
    <script src="checks.js"></script>
    <script>
      var refusals = [];
      odr.onEditRefused = function (event) {
        refusals.push(event.reason);
      };
      function text(column, row) {
        return odr.sheet.cellAt(column, row).textContent;
      }
      function type(column, row, typed) {
        odr.editing.editAt(column, row);
        var editor = document.querySelector(".odr-sheet-editor");
        editor.value = typed;
        editor.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      }
      function shows() {
        return [text(1, 0), text(1, 1), text(1, 2), text(2, 0), text(3, 0)].join("|");
      }

      odr.editing.enable();
      odr.editing.loadFormulas().then(function (computes) {
        check("the page computes", computes === true);

        type(0, 1, "5");
        check("an edit computes every cell of the range, and what reads one", shows() === "2|10|6|11|35", shows());

        refusals = [];
        odr.editing.editAt(1, 1);
        check("a cell of the range is refused", refusals.join() === "array" && document.querySelector(".odr-sheet-editor") === null, refusals.join());
        odr.editing.editAt(1, 0);
        check("and so is the formula's own", refusals.join() === "array,array", refusals.join());

        refusals = [];
        odr.sheet.pin({ column: 0, row: 1 });
        odr.editing.insertRows();
        check("a row edit through the range is refused", refusals.join() === "unsupportedEdit" && text(1, 1) === "10", refusals.join());

        refusals = [];
        odr.sheet.pin({ column: 5, row: 0 });
        odr.editing.insertColumns();
        check("so is a column edit through an array that reads no cell", refusals.join() === "unsupportedEdit" && text(5, 0) === "2", refusals.join());

        refusals = [];
        odr.sheet.pin({ column: 0, row: 0 });
        odr.editing.insertRows();
        type(0, 2, "7");
        check("after a row edit above it the range computes where it moved", text(1, 2) === "14" && text(2, 1) === "15", text(1, 2) + " " + text(2, 1));

        odr.editing.undo();
        odr.editing.undo();
        odr.editing.undo();
        check("the undos put back what the file showed", shows() === "2|4|6|5|14", shows());
      });
    </script>
  </body>
</html>
