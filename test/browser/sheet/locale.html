<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>sheet locale checks</title>
    <link rel="stylesheet" href="document.css" />
    <link rel="stylesheet" href="spreadsheet.css" />
  </head>
  <!-- An ods whose default style states German, as `translate` writes it. -->
  <body
    class="odr-body odr-gridlines-soft"
    data-odr-editable="true"
    data-odr-keyboard="navigation shortcuts"
    data-odr-locale="de-DE"
  >
    <table class="odr-sheet" data-odr-sheet="0">
      <col class="odr-sheet-gutter" />
      <col style="width: 80px" />
      <thead>
        <tr>
          <th class="odr-sheet-corner" style="width:calc(1ch + 14px)"></th>
          <th class="odr-sheet-column-header">A</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th class="odr-sheet-row-header">1</th>
          <td style="max-width:0;white-space:nowrap"></td>
        </tr>
        <tr>
          <th class="odr-sheet-row-header">2</th>
          <td style="max-width:0;white-space:nowrap">2,5</td>
        </tr>
        <tr>
          <th class="odr-sheet-row-header">3</th>
          <td class="odr-value-type-float" data-odr-value="1234.5" style="max-width:0;white-space:nowrap">1.234,50 €</td>
        </tr>
      </tbody>
    </table>

    <div id="report"></div>
    <script src="error-codes.js"></script>
    <script src="editing.js"></script>
    <script src="spreadsheet.js"></script>
    <script src="sheet-editing.js"></script>
    <script src="checks.js"></script>
    <script>
      function editor() {
        return document.querySelector(".odr-sheet-editor");
      }
      function type(text) {
        odr.editing.editAt(0, 0);
        editor().value = text;
        editor().dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        return JSON.parse(odr.editing.getOperations()).ops[0].value;
      }

      odr.editing.enable();
      var value = type("1,5");
      check("a comma is the decimal separator", value.type === "number" && value.number === 1.5);
      check("and the cell shows what was typed", value.text === "1,5");
      value = type("-1,25e2");
      check("with a sign and an exponent", value.type === "number" && value.number === -125);
      value = type("1.5");
      check("a point is not", value.type === "string" && value.text === "1.5");

      value = type("2.1.2025");
      check("a date is day first here", value.type === "date" && value.number === 45659);

      odr.editing.editAt(0, 1);
      check("a string that reads as a number here opens quoted", editor().value === "'2,5");
      editor().dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));

      check("a formatted number reads as its value", odr.sheet.valueAt(0, 2).number === 1234.5);
      odr.editing.editAt(0, 2);
      check("and opens on it, in the locale's spelling", editor().value === "1234,5");
      var before = JSON.parse(odr.editing.getOperations()).ops.length;
      editor().dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
      check(
        "so a commit of it unchanged writes nothing",
        JSON.parse(odr.editing.getOperations()).ops.length === before
      );
    </script>
  </body>
</html>
