<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>host bridge checks: android</title>
  </head>
  <body data-odr-editable="true" data-odr-keyboard="navigation shortcuts">
    <div id="report"></div>
    <script>
      // what addJavascriptInterface puts on the page: a method takes strings
      var posted = [];
      window.reader = {
        postMessage: function (json) {
          posted.push(json);
        },
      };
    </script>
    <script src="error-codes.js"></script>
    <script src="editing.js"></script>
    <script>
      window.odr = window.odr || {};
      window.odr.hostMessageHandler = "reader.postMessage";
    </script>
    <script src="host-bridge.js"></script>
    <script src="checks.js"></script>
    <script>
      odr.editing.changed();
      check("a message is posted as a string", typeof posted[0] === "string", posted);
      var message = JSON.parse(posted[0]);
      check(
        "holding the type and the detail",
        message.type === "editChange" && message.detail.dirty === false,
        message
      );

      odr.onSelectionChange();
      check(
        "a callback without an argument posts a null detail",
        JSON.parse(posted[1]).detail === null,
        posted[1]
      );
    </script>
  </body>
</html>
