<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>host bridge checks: webkit</title>
  </head>
  <body data-odr-editable="true" data-odr-keyboard="navigation shortcuts">
    <div id="report"></div>
    <script>
      // what WKUserContentController puts on the page. Its `postMessage`
      // throws unless it is called on the handler
      var posted = [];
      var reader = {
        postMessage: function (message) {
          if (this !== reader) {
            throw new TypeError("Can only call postMessage on its handler");
          }
          check("a message is posted as a string", typeof message === "string", message);
          posted.push(JSON.parse(message));
        },
      };
      window.webkit = { messageHandlers: { reader: reader } };
    </script>
    <script src="error-codes.js"></script>
    <script src="editing.js"></script>
    <script src="pdf-annotation.js"></script>
    <!-- what `write_host_bridge_script` writes, last in the body -->
    <script>
      window.odr = window.odr || {};
      window.odr.hostMessageHandler = "webkit.messageHandlers.reader.postMessage";
    </script>
    <script src="host-bridge.js"></script>
    <script src="checks.js"></script>
    <script>
      function last() {
        return posted[posted.length - 1];
      }

      odr.editing.changed();
      check(
        "an edit change is posted",
        last().type === "editChange" &&
          last().detail.dirty === false &&
          last().detail.canUndo === false,
        last()
      );

      odr.editing.refuse("readOnly", { sheet: 0, column: 1, row: 2 });
      check(
        "a refusal carries its code and its detail",
        last().type === "editRefused" &&
          last().detail.reason === "readOnly" &&
          last().detail.code === odr.errorCodes.readOnly &&
          last().detail.row === 2,
        last()
      );

      odr.editing.stale({ sheet: 0, cells: [[1, 2]] });
      check(
        "stale cells are posted",
        last().type === "cellsStale" && last().detail.cells.length === 1,
        last()
      );

      odr.editing.selectionChanged({ bold: true });
      check(
        "a selection change is posted",
        last().type === "selectionChange" && last().detail.bold === true,
        last()
      );

      odr.editing.enable();
      check(
        "a mode change is posted",
        last().type === "editModeChange" && last().detail.editing === true,
        last()
      );
      odr.editing.disable();

      odr.onAnnotationChange({ count: 3 });
      check(
        "the bridge replaces the annotation default",
        last().type === "annotationChange" && last().detail.count === 3,
        last()
      );

      odr.onError(1007, "x");
      check(
        "an error's two arguments become one detail",
        last().type === "error" && last().detail.code === 1007 && last().detail.message === "x",
        last()
      );

      odr.onZoomChange(1.5, false);
      check(
        "a zoom change's two arguments become one detail",
        last().type === "zoomChange" && last().detail.zoom === 1.5 && last().detail.followsFit === false,
        last()
      );

      var count = posted.length;
      odr.onEditChange = function () {};
      odr.editing.changed();
      check("a host can still replace a callback", posted.length === count);
    </script>
  </body>
</html>
