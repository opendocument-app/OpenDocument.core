<!doctype html>
<meta charset="utf-8" />
<title>pdf annotation checks</title>
<link rel="stylesheet" href="pdf-annotation.css" />
<style>
  body {
    margin: 0;
    font: 13px/1.5 system-ui, sans-serif;
  }
  #report {
    position: fixed;
    right: 0;
    top: 0;
    width: 30em;
    max-height: 100vh;
    overflow: auto;
    padding: 1em;
    background: #fff;
    border-left: 1px solid #ccc;
    z-index: 10;
  }
  /* stands in for a rendered page: laid out in inches, as the pdf view does */
  .p {
    position: relative;
    background: #fff;
    margin: 1em;
    box-shadow: 0 0 4px #999;
  }
  .x0 {
    width: 8.5in;
  }
  .y0 {
    height: 11in;
  }
  .t {
    position: absolute;
    white-space: pre;
    line-height: 1;
  }
  /* as the real selection layer: an inline-block whose box is the laid-out
     line, taller than the rect a range gets from the substituted font */
  .sr {
    display: inline-block;
    line-height: 1.6;
  }
</style>

<div id="report"></div>

<!-- a us-letter page: 612x792pt, y-down, so the map back to user space is
     [1 0 0 -1 0 792] -->
<div class="p x0 y0" id="p1" data-odr-page="0" data-odr-space="1,0,0,-1,0,792">
  <div class="t" style="left: 72pt; top: 92pt; font-size: 12pt">
    <span class="sr">Selectable text on page one</span>
  </div>
</div>
<div class="p x0 y0" id="p2" data-odr-page="1" data-odr-space="1,0,0,-1,0,792">
  <div class="t" style="left: 72pt; top: 92pt; font-size: 12pt">
    <span class="sr">Selectable text on page two</span>
  </div>
</div>

<script src="checks.js"></script>
<script src="pdf-annotation.js"></script>
<script>
  function near(a, b, tolerance) {
    return Math.abs(a - b) <= (tolerance === undefined ? 0.75 : tolerance);
  }

  const api = window.odr.annotation;

  function selectRun(page) {
    const run = document
      .querySelector('[data-odr-page="' + page + '"]')
      .querySelector(".sr");
    const range = document.createRange();
    range.selectNodeContents(run);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    return run;
  }

  function payload() {
    return JSON.parse(api.getAnnotations());
  }

  async function run() {
    check("the api is exposed", typeof api.getAnnotations === "function");

    // --- nothing is marked until the host asks ----------------------------
    api.clear();
    api.setTool("highlight");
    api.setColor([1, 0.9, 0.2]);
    selectRun(0);
    await new Promise((r) => setTimeout(r, 100));
    check("a selection alone marks nothing", api.list().length === 0, api.list());

    check("mark() takes the selection", api.mark() === true);
    check("and it is one annotation", api.list().length === 1, api.list());
    check(
      "the selection is left standing",
      !window.getSelection().isCollapsed
    );
    check("mark() on the same selection adds another", api.mark() === true);
    api.undo();

    // --- a selection becomes one quad in user space -----------------------
    const run1 = document.querySelector('[data-odr-page="0"] .sr');

    const first = payload().annotations[0];
    check("it names its page", first.page === 0, first.page);
    check("it is a highlight", first.type === "highlight", first.type);
    check("it has one quad of eight numbers", first.quads.length === 1 &&
      first.quads[0].length === 8, first.quads);

    // Measured off the run's own rect rather than through the script, and
    // rather than off the css: a text range's rect follows the font's metrics,
    // not the line box.
    const q = first.quads[0];
    const page = document.querySelector('[data-odr-page="0"]');
    const runRect = run1.getBoundingClientRect();
    const pageRect = page.getBoundingClientRect();
    const topPt =
      ((runRect.top - pageRect.top) / (pageRect.width / page.offsetWidth)) * 0.75;
    check(
      "the quad's top edge maps to user space",
      near(q[1], 792 - topPt),
      [q[1], 792 - topPt]
    );
    check("its bottom edge is below the top", q[5] < q[1], [q[1], q[5]]);
    check("upper-left is left of upper-right", q[0] < q[2], [q[0], q[2]]);
    check(
      "the quad is z-ordered (ul, ur, ll, lr)",
      near(q[1], q[3]) && near(q[5], q[7]) && near(q[0], q[4]) && near(q[2], q[6]),
      q
    );

    // the quad follows the run's box, not the substituted font's rect
    const zoom0 = pageRect.width / page.offsetWidth;
    const rangeRect = window.getSelection().getRangeAt(0).getClientRects()[0];
    check(
      "the run's box is taller than the range's rect",
      runRect.height > rangeRect.height + 1,
      [runRect.height, rangeRect.height]
    );
    check(
      "the quad covers the run's box, not that rect",
      near(q[1] - q[5], (runRect.height / zoom0) * 0.75),
      [q[1] - q[5], (runRect.height / zoom0) * 0.75, (rangeRect.height / zoom0) * 0.75]
    );

    // --- opted in, a drag marks once, not once per character ------------
    api.clear();
    api.setTool("highlight");
    api.setOptions({ markOnSelection: true });
    const text = document.querySelector('[data-odr-page="0"] .sr').firstChild;
    const pointer = (type) =>
      document.dispatchEvent(
        new PointerEvent(type, { bubbles: true, pointerId: 2, button: 0 })
      );
    window.getSelection().removeAllRanges();
    pointer("pointerdown");
    for (let k = 1; k <= 6; ++k) {
      window.getSelection().setBaseAndExtent(text, 0, text, k);
      await new Promise((r) => setTimeout(r, 5));
    }
    pointer("pointerup");
    await new Promise((r) => setTimeout(r, 100));
    check(
      "a drag makes one annotation, not one per character",
      api.list().length === 1,
      api.list().length
    );
    check(
      "the automatic path takes the selection with it",
      window.getSelection().isCollapsed
    );
    api.setOptions({ markOnSelection: false });
    api.clear();
    api.setTool("highlight");
    selectRun(0);
    api.mark();

    // --- the overlay is drawn, and the wash is the one that multiplies ----
    const page1 = document.querySelector('[data-odr-page="0"]');
    check("an overlay is added", page1.querySelectorAll("svg.an").length >= 1);
    check(
      "the highlight goes in the multiplying overlay",
      page1.querySelector("svg.an-m path") !== null
    );

    api.clear();
    api.setTool("underline");
    selectRun(0);
    api.mark();
    check(
      "an underline does not multiply",
      page1.querySelector("svg.an-m path") === null &&
        page1.querySelector('svg[class="an"] path') !== null
    );

    // --- a second page is addressed by its own index ---------------------
    api.clear();
    api.setTool("highlight");
    selectRun(1);
    api.mark();
    check("page two annotates as page 1", payload().annotations[0].page === 1);

    // --- ink through real pointer events ---------------------------------
    api.clear();
    api.setTool("ink");
    api.setWidth(3);
    api.setColor([0.9, 0.1, 0.1]);
    const rect = page1.getBoundingClientRect();
    const zoom = rect.width / page1.offsetWidth;
    const at = (bx, by) => ({
      clientX: rect.left + (bx / 0.75) * zoom,
      clientY: rect.top + (by / 0.75) * zoom,
      bubbles: true,
      pointerId: 1,
      button: 0,
    });
    page1.setPointerCapture = () => {};
    document.dispatchEvent(new PointerEvent("pointerdown", at(100, 100)));
    document.dispatchEvent(new PointerEvent("pointermove", at(140, 140)));
    document.dispatchEvent(new PointerEvent("pointermove", at(180, 100)));
    document.dispatchEvent(new PointerEvent("pointerup", at(180, 100)));

    const ink = payload().annotations[0];
    check("a drag makes an ink annotation", ink && ink.type === "ink", ink);
    check("its width carries", ink && ink.width === 3, ink && ink.width);
    check(
      "its first point is where the pointer went down",
      ink && near(ink.strokes[0][0], 100) && near(ink.strokes[0][1], 692),
      ink && ink.strokes[0].slice(0, 2)
    );

    // --- undo, remove, clear ---------------------------------------------
    const before = api.list().length;
    api.undo();
    check("undo drops the last one", api.list().length === before - 1);

    api.setTool("highlight");
    selectRun(0);
    api.mark();
    const id = api.list()[api.list().length - 1].id;
    api.remove(id);
    check("remove drops it by id", !api.list().some((a) => a.id === id));

    api.clear();
    check("clear empties the model", api.list().length === 0);
    check(
      "and the overlays with it",
      page1.querySelectorAll("svg.an path").length === 0
    );

    // --- the tool gates pointer capture -----------------------------------
    api.setTool("ink");
    check("ink arms the page for drawing", page1.classList.contains("an-draw"));
    check(
      "and the document, for the scroller it sits in",
      document.documentElement.classList.contains("an-drawing")
    );
    api.setTool("highlight");
    check(
      "a text tool leaves selection alone",
      !page1.classList.contains("an-draw") &&
        !document.documentElement.classList.contains("an-drawing")
    );
    api.setTool(null);

    // --- the gesture policy is the host's, and reaches the css ------------
    check(
      "the defaults draw nothing on their own",
      api.getOptions().markOnSelection === false &&
        api.getOptions().inkPointerTypes === null
    );
    api.setTool("ink");
    check(
      "a touch on the overlay does not pan by default",
      getComputedStyle(page1.querySelector("svg.an")).touchAction === "none"
    );
    api.setOptions({ touchAction: "pinch-zoom" });
    check(
      "setOptions reaches the overlay",
      getComputedStyle(page1.querySelector("svg.an")).touchAction ===
        "pinch-zoom",
      getComputedStyle(page1.querySelector("svg.an")).touchAction
    );
    api.setOptions({ touchAction: "none" });
    check("getOptions reports what was set", api.getOptions().touchAction === "none");

    let threw = false;
    try {
      api.setOptions({ nonesuch: 1 });
    } catch (e) {
      threw = true;
    }
    check("an unknown option throws rather than being ignored", threw);

    // --- pointer types the host does not want are not drawn with ----------
    api.clear();
    api.setOptions({ inkPointerTypes: ["pen"] });
    const withType = (type, x, y) =>
      Object.assign(at(x, y), { pointerType: type, pointerId: 7 });
    document.dispatchEvent(new PointerEvent("pointerdown", withType("touch", 100, 200)));
    document.dispatchEvent(new PointerEvent("pointermove", withType("touch", 140, 240)));
    document.dispatchEvent(new PointerEvent("pointerup", withType("touch", 140, 240)));
    check("a rejected pointer type draws nothing", api.list().length === 0, api.list());

    document.dispatchEvent(new PointerEvent("pointerdown", withType("pen", 100, 200)));
    document.dispatchEvent(new PointerEvent("pointermove", withType("pen", 140, 240)));
    document.dispatchEvent(new PointerEvent("pointerup", withType("pen", 140, 240)));
    check("the accepted one draws", api.list().length === 1, api.list());
    api.setOptions({ inkPointerTypes: null });

    // --- a stroke extends its own path, it does not rebuild the page ------
    api.clear();
    api.setTool("highlight");
    selectRun(0);
    api.mark();
    const settled = page1.querySelector("svg.an-m path");
    api.setTool("ink");
    document.dispatchEvent(new PointerEvent("pointerdown", at(100, 300)));
    document.dispatchEvent(new PointerEvent("pointermove", at(140, 340)));
    const live = page1.querySelector('svg[class="an"] path');
    document.dispatchEvent(new PointerEvent("pointermove", at(180, 300)));
    // pointerup flushes; a background window never gives us the frame
    document.dispatchEvent(new PointerEvent("pointerup", at(180, 300)));
    check(
      "the live path grows in place, in the node it started in",
      live.isConnected && live.getAttribute("d").split(" L ").length === 3,
      live.getAttribute("d")
    );
    check("and what was already drawn is not rebuilt", settled.isConnected);

    // a second pointer must not extend the stroke it did not start
    document.dispatchEvent(new PointerEvent("pointerdown", at(100, 400)));
    const points = () => api.list()[api.list().length - 1].strokes[0].length;
    const started = points();
    document.dispatchEvent(
      new PointerEvent("pointermove", Object.assign(at(300, 400), { pointerId: 9 }))
    );
    check("a second pointer does not extend the stroke", points() === started);
    document.dispatchEvent(new PointerEvent("pointerup", at(100, 400)));

    api.clear();
    api.setTool(null);
  }

  run();
</script>
