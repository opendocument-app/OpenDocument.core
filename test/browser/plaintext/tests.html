<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>plain-text editing checks</title>
    <link rel="stylesheet" href="text.css" />
  </head>
  <body data-odr-editable="true" data-odr-keyboard="navigation shortcuts">
    <!-- A `.txt` view as `translate` writes one: the lines in chunks, the
         first line of each stating the number it counts from, and no
         `contenteditable` - the mode puts that on. A chunk holds 256 lines;
         two lines here put the chunk boundary inside the checks. -->
    <div class="odr-text" style="--odr-text-digits:1">
      <div class="odr-text-body odr-text-wrap">
        <div class="odr-text-lines odr-chunk odr-chunk-near">
          <div style="counter-reset:odr-line 0">first line</div>
          <div>second line</div>
        </div>
        <div class="odr-text-lines odr-chunk" style="--odr-text-lines:1">
          <div style="counter-reset:odr-line 2">third line</div>
        </div>
      </div>
    </div>

    <!-- Not editable: the report is the harness, not the file. -->
    <div id="out" contenteditable="false"><div id="report"></div></div>
    <!-- the table the library writes into a page, ahead of the script
         that reads it; `serve.py` builds it from `odr/error_code.*` -->
    <script src="error-codes.js"></script>
    <script src="editing.js"></script>
    <script src="text.js"></script>
    <script src="checks.js"></script>
    <script>
      var refusals = [];
      var changes = [];
      odr.onEditRefused = function (event) {
        refusals.push(event.reason + " " + event.code);
      };
      odr.onEditChange = function (event) {
        changes.push(event);
      };

      var body = document.querySelector(".odr-text-body");

      function lineNodes() {
        return body.querySelectorAll(".odr-text-lines > div");
      }
      function lines() {
        return Array.prototype.map
          .call(lineNodes(), function (line) {
            return line.textContent;
          })
          .join("|");
      }
      /// The number each chunk counts from.
      function starts() {
        return Array.prototype.map
          .call(body.children, function (chunk) {
            return chunk.firstElementChild.style.counterReset.replace(
              "odr-line ",
              ""
            );
          })
          .join("|");
      }
      function ops() {
        return JSON.parse(odr.editing.getOperations()).ops;
      }
      /// Puts the caret at an offset in one of the lines.
      function caretAt(lineNr, offset) {
        var line = lineNodes()[lineNr];
        var range = document.createRange();
        range.setStart(line.firstChild, offset);
        range.collapse(true);
        var selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }
      /// `"taken"` where the editor did the edit, `"refused"` where it said
      /// no - both cancel the `beforeinput`, as in the document editor.
      function input(type, data) {
        var before = refusals.length;
        var event = new InputEvent("beforeinput", {
          inputType: type,
          data: data === undefined ? null : data,
          bubbles: true,
          cancelable: true,
        });
        body.dispatchEvent(event);
        return refusals.length > before ? "refused" : "taken";
      }

      // ------------------------------------------------------------ the mode

      check(
        "a plain-text view carries the editing mode",
        typeof odr.editing === "object" && odr.editing.isEditable() === true
      );
      check(
        "and `generateDiff` a host wired once",
        typeof odr.generateDiff === "function"
      );
      check("the mode is off to start with", odr.editing.isEnabled() === false);
      check(
        "so the lines are not editable yet",
        body.getAttribute("contenteditable") === null
      );

      caretAt(0, 5);
      check("and an edit is refused", input("insertText", "X") === "refused");
      check("as read-only", refusals.pop() === "readOnly 1005");
      check("with nothing changed", lines() === "first line|second line|third line");

      check("the mode turns on", odr.editing.enable() === true);
      check(
        "and the lines take the caret",
        body.getAttribute("contenteditable") === "true"
      );

      // -------------------------------------------------------------- typing

      caretAt(0, 5);
      check("typing is taken", input("insertText", "X") === "taken");
      check("and lands in the line", lines() === "firstX line|second line|third line");
      check(
        "the log is one setContent naming the whole file",
        ops().length === 1 &&
          ops()[0].op === "setContent" &&
          ops()[0].text === "firstX line\nsecond line\nthird line"
      );
      check("with no id, because a plain file has no elements", ops()[0].id === undefined);

      caretAt(0, 6);
      input("insertText", "Y");
      check("a second keystroke is still one operation", ops().length === 1);
      check(
        "carrying the text the file ends at",
        ops()[0].text === "firstXY line\nsecond line\nthird line"
      );

      check("a bold toggle is refused", input("formatBold") === "refused");
      check("as an edit we cannot record", refusals.pop() === "unsupportedEdit 1007");
      check("and nothing changed", lines() === "firstXY line|second line|third line");

      // ------------------------------------------------------- lines come and go

      caretAt(1, 6);
      check("Enter is taken", input("insertParagraph") === "taken");
      check(
        "and splits the line",
        lines() === "firstXY line|second| line|third line"
      );
      check("the next chunk counts on from the new line", starts() === "0|3");
      check(
        "and the log carries the new line",
        ops()[0].text.split("\n").length === 4
      );

      caretAt(2, 0);
      check("Backspace at a line start is taken", input("deleteContentBackward") === "taken");
      check("and joins the two", lines() === "firstXY line|second line|third line");
      check("and counts from the old one again", starts() === "0|2");

      function digits() {
        return body.parentNode.style.getPropertyValue("--odr-text-digits");
      }
      input("insertText", "\n\n\n\n\n\n\n");
      check("ten lines widen the gutter to two digits", digits() === "2");
      odr.editing.undo();
      check("and undo narrows it again", digits() === "1");

      // Deleting across the chunk boundary: the chunk left with no line goes,
      // because it would keep its height.
      caretAt(0, 1);
      (function () {
        var r = document.createRange();
        r.setStart(lineNodes()[0].firstChild, 1);
        r.setEnd(lineNodes()[2].firstChild, 1);
        var s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
      })();
      check(
        "deleting across three lines is taken",
        input("deleteContentBackward") === "taken"
      );
      check("the lines go", lineNodes().length === 1);
      check("and the emptied chunk with them", starts() === "0");
      check("undo brings the lines back", odr.editing.undo() === true);
      check(
        "into the chunk that stayed",
        lineNodes().length === 3 && starts() === "0"
      );

      // ---------------------------------------------------------- undo / redo

      check("undo takes the join back", odr.editing.undo() === true);
      check("and the line is split again", lines() === "firstXY line|second| line|third line");
      check("a host is told there is more to undo", changes.pop().canUndo === true);
      check("redo puts it back", odr.editing.redo() === true);
      check("and the lines are joined", lines() === "firstXY line|second line|third line");

      while (odr.editing.undo()) {
        // wind the whole session back
      }
      check(
        "undo reaches the start",
        changes[changes.length - 1].canUndo === false
      );
      check(
        "and the file is what the render wrote",
        lines() === "first line|second line|third line"
      );
      check("with the log empty", ops().length === 0);
      check("and a host told it is clean", changes.pop().dirty === false);

      note("Fallback deletes keep surrogate pairs whole");
      ["deleteContentBackward", "deleteContentForward"].forEach(function (type) {
        lineNodes()[0].textContent = "A😀B";
        odr.editing.committed();
        caretAt(0, type === "deleteContentBackward" ? 3 : 1);
        input(type);
        check(type + " removes the whole emoji", lineNodes()[0].textContent === "AB");
        check("the saved content carries the deletion", ops()[0].text.split("\n")[0] === "AB");
        odr.editing.undo();
        check("undo restores both UTF-16 units", lineNodes()[0].textContent === "A😀B");
        odr.editing.redo();
        check("redo removes both units", lineNodes()[0].textContent === "AB");
      });
      lineNodes()[0].textContent = "first line";
      odr.editing.committed();

      // ------------------------------------------------------------- the host

      odr.editing.enable();
      caretAt(0, 0);
      input("insertText", "Z");
      var envelope = JSON.parse(odr.editing.getOperations());
      check(
        "the envelope states the version the library takes",
        envelope.version === 2 && envelope.ops.length === 1
      );
      odr.editing.committed();
      check("committing clears the log", ops().length === 0);
      check("and undo with it", odr.editing.undo() === false);

      odr.editing.disable();
      check(
        "turning the mode off puts the view back",
        body.getAttribute("contenteditable") === null
      );
      caretAt(0, 1);
      input("insertText", "Q");
      check(
        "and an edit no longer lands",
        lines() === "Zfirst line|second line|third line"
      );

      note("Deleting across three chunks keeps the edit and its undo");
      odr.editing.enable();
      odr.editing.committed();
      body.textContent = "";
      var original = [];
      for (var c = 0; c < 3; ++c) {
        var chunk = document.createElement("div");
        chunk.className = "odr-text-lines odr-chunk odr-chunk-near";
        body.appendChild(chunk);
        for (var i = 0; i < (c === 2 ? 1 : 256); ++i) {
          var line = document.createElement("div");
          line.textContent = "line " + (original.length + 1);
          original.push(line.textContent);
          chunk.appendChild(line);
        }
      }
      var range = document.createRange();
      range.setStart(lineNodes()[0].firstChild, 0);
      range.setEnd(lineNodes()[512].firstChild, lineNodes()[512].textContent.length);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      input("deleteContentBackward");
      check("deleting 513 lines leaves one empty line", lines() === "" && lineNodes().length === 1);
      check("the empty chunks are removed", body.childElementCount === 1);
      check("the log saves the deletion", ops().length === 1 && ops()[0].text === "");
      check("undo restores all the text", odr.editing.undo() && lines() === original.join("|"));
      check("redo deletes it again", odr.editing.redo() && lines() === "");
    </script>
  </body>
</html>
